# Render Blueprint: one web service (API + built web app on a single port) and a managed PostgreSQL database.
# In Render: New → Blueprint → select this repository. Render creates both and links DATABASE_URL.
services:
  - type: web
    name: rio-lindo-pos
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: rio-lindo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # First start shows the set-up screen to create the hotel and owner account (no demo data).
      - key: SEED_DEMO
        value: "false"
      # Payslip and factura e-mail. Fill these in the Render dashboard; payroll works without them (PDF only).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: rio-lindo-db
    plan: basic-256mb
    region: oregon
    databaseName: rio_lindo
    user: rio_lindo
